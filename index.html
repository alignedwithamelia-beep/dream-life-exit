<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1521" />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem('dream-life-theme');
        if (t !== 'light') document.documentElement.classList.add('dark'); // dark unless the user chose light
      } catch (e) {}
    </script>
    <title>The Dream Life™ Exit Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
